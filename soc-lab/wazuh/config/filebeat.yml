# Wazuh - Filebeat configuration file
# NOTE: document_type: "" is set to strip _type from bulk API requests,
# required for OpenSearch 2.x compatibility (ES 7 _type removed in ES 8+).
# See: "Action/metadata line [1] contains an unknown parameter [_type]"
filebeat.modules:
  - module: wazuh
    alerts:
      enabled: true
    archives:
      enabled: false

setup.template.json.enabled: true
setup.template.overwrite: true
setup.template.json.path: '/etc/filebeat/wazuh-template.json'
setup.template.json.name: 'wazuh'
setup.ilm.enabled: false

output.elasticsearch:
  hosts: ['https://wazuh.indexer:9200']
  username: 'admin'
  password: 'admin'
  ssl.verification_mode: 'full'
  ssl.certificate_authorities: ['/etc/ssl/root-ca.pem']
  ssl.certificate: '/etc/ssl/wazuh-1.pem'
  ssl.key: '/etc/ssl/wazuh-1-key.pem'
  document_type: ""

logging.metrics.enabled: false

seccomp:
  default_action: allow
  syscalls:
  - action: allow
    names:
    - rseq
